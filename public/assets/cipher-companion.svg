    <radialGradient id="halo"><stop stop-color="#1de4ff" stop-opacity=".24"/><stop offset="1" stop-color="#00a8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="skin" x2=".8" y2="1"><stop stop-color="#a75c3c"/><stop offset=".46" stop-color="#75402f"/><stop offset="1" stop-color="#432a25"/></linearGradient>
    <linearGradient id="hair" x2=".9" y2="1"><stop stop-color="#241c1b"/><stop offset=".55" stop-color="#090d12"/><stop offset="1" stop-color="#332522"/></linearGradient>
    <linearGradient id="shirt" x2="0" y2="1"><stop stop-color="#25303a"/><stop offset="1" stop-color="#090e15"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
