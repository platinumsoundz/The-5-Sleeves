<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" role="img" aria-labelledby="title desc">
  <title id="title">Cipher, holographic companion</title>
  <desc id="desc">A warm, observant woman with long braids appears as a cyan-blue hologram.</desc>
