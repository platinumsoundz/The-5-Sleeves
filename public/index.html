<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#09111f" />
    <title>The 5 Sleeves Online</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #09111f; }
      body { font-family: system-ui, sans-serif; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; }
      #status { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; padding: 6px 10px; border: 1px solid #42f5c5; border-radius: 999px; background: rgba(9,17,31,.82); color: #bfffee; font-size: 12px; pointer-events: none; }
      #status.offline { border-color: #ff6b7a; color: #ffc1c8; }
      #dpad { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); display: grid; grid-template: repeat(3, 58px) / repeat(3, 58px); gap: 4px; }
      .dpad-button, .action-button { border: 1px solid rgba(151,255,230,.6); color: #dffff6; font-weight: bold; touch-action: none; user-select: none; }
      .dpad-button { border-radius: 14px; background: rgba(11,47,61,.82); font-size: 23px; }
      .dpad-button:active, .dpad-button.active { background: #168e86; transform: scale(.94); }
      [data-direction="up"] { grid-column: 2; grid-row: 1; } [data-direction="left"] { grid-column: 1; grid-row: 2; } [data-direction="right"] { grid-column: 3; grid-row: 2; } [data-direction="down"] { grid-column: 2; grid-row: 3; }
      #actions { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); display: flex; align-items: end; gap: 10px; }
      .action-button { width: 66px; height: 66px; border-radius: 50%; background: rgba(28,38,91,.88); font-size: 11px; line-height: 1.1; box-shadow: 0 0 16px rgba(88,106,255,.25); }
      .action-button.primary { width: 82px; height: 82px; background: rgba(140,42,160,.9); border-color: #fb9aff; font-size: 13px; }
      .action-button:active { transform: scale(.92); filter: brightness(1.4); }
      #title-screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at center, rgba(19,55,73,.88), rgba(4,10,21,.97) 72%), repeating-linear-gradient(0deg, transparent 0 39px, rgba(91,211,201,.08) 40px); }
      #title-screen.hidden { display: none; }
      .title-panel { width: min(440px, 100%); padding: 32px 26px; text-align: center; border: 1px solid rgba(118,255,224,.55); border-radius: 18px; background: rgba(5,16,29,.94); box-shadow: 0 0 48px rgba(34,228,201,.18), inset 0 0 30px rgba(32,145,153,.1); }
      .title-kicker { color: #69f5d9; letter-spacing: .32em; font-size: 11px; }
      .title-panel h1 { margin: 14px 0 8px; color: #eafffa; font-size: clamp(25px, 7vw, 38px); line-height: 1.1; letter-spacing: .05em; text-shadow: 0 0 18px rgba(76,255,222,.42); }
      .title-panel p { color: #91aeb9; margin: 0 0 24px; font-size: 14px; }
      #username-input { width: 100%; padding: 13px 14px; border: 1px solid #3d8d8b; border-radius: 9px; outline: none; background: #0b1c2a; color: #effffb; font: inherit; font-size: 16px; }
      #username-input:focus { border-color: #67ffde; box-shadow: 0 0 0 3px rgba(103,255,222,.12); }
      #enter-button { width: 100%; margin-top: 14px; padding: 14px; border: 1px solid #adfff0; border-radius: 9px; background: linear-gradient(110deg,#087a79,#23bda0); color: #f1fffb; font: 800 15px system-ui,sans-serif; letter-spacing: .12em; }
      #enter-button:disabled { opacity: .55; }
      #name-error { min-height: 20px; margin-top: 10px; color: #ff8b9b; font-size: 13px; }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" aria-label="The 5 Sleeves game area"></canvas>
    <div id="title-screen" role="dialog" aria-modal="true" aria-labelledby="game-title">
      <form class="title-panel" id="join-form">
        <div class="title-kicker">OPERATIVE IDENTIFICATION</div>
        <h1 id="game-title">THE 5 SLEEVES:<br />CIPHER CONDUIT</h1>
        <p>Choose your name to enter the Conduit.</p>
        <input id="username-input" name="username" type="text" maxlength="18" minlength="2" autocomplete="nickname" placeholder="Character name" aria-label="Character name" required />
        <button id="enter-button" type="submit">[ ENTER CONDUIT ]</button>
        <div id="name-error" role="alert" aria-live="polite"></div>
      </form>
    </div>
    <div id="status" class="offline">Connecting…</div>
    <div id="dpad" aria-label="Movement controls">
      <button class="dpad-button" data-direction="up" aria-label="Move up">▲</button>
      <button class="dpad-button" data-direction="left" aria-label="Move left">◀</button>
      <button class="dpad-button" data-direction="right" aria-label="Move right">▶</button>
      <button class="dpad-button" data-direction="down" aria-label="Move down">▼</button>
    </div>
    <div id="actions" aria-label="Sleeve abilities">
      <button class="action-button" data-action="shield" aria-label="Activate shield">SHIELD</button>
      <button class="action-button" data-action="dash" aria-label="Dash in movement direction">DASH</button>
      <button class="action-button primary" data-action="attack" aria-label="Fire energy blast">BLAST</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
